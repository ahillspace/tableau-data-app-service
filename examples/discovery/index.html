<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discover Tableau Data App Service</title>
</head>
<body>
  <h1>Discover Tableau Data App Service</h1>
  <button id="discover">Sign in with Tableau</button>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    import { createService } from "../sdk/index.js";

    const service = createService({ origin: window.location.origin, appId: "discovery-example" });
    const button = document.querySelector("#discover");
    const result = document.querySelector("#result");

    async function discover() {
      const response = await service.request("/v1/discovery");
      result.textContent = JSON.stringify(await response.json(), null, 2);
    }

    button.addEventListener("click", async () => {
      try {
        await service.signIn();
        await discover();
      } catch (error) {
        result.textContent = error.message;
      }
    });
  </script>
</body>
</html>
