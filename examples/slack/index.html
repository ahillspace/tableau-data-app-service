<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slack Data App</title>
<link rel="stylesheet" href="/style.css">
<main>
  <header><p class="eyebrow">Data App example</p><h1>Slack, in your view.</h1><p>Sign in with Tableau, connect Slack, and make a native API request.</p></header>
  <section aria-labelledby="account-heading">
    <h2 id="account-heading">Your connection</h2>
    <p id="identity">Checking your session…</p>
    <div class="actions"><button id="sign-in" type="button">Sign in with Tableau</button><button id="connect" type="button" disabled>Connect Slack</button></div>
    <label for="connection">Slack account</label><select id="connection" disabled><option value="">Connect an account to continue</option></select>
    <button id="reauthorize" class="secondary" type="button" disabled>Reconnect selected account</button>
    <details id="static-setup" hidden><summary>Connect with an existing Slack token</summary>
      <form id="token-form"><label for="slack-token">Slack token</label><input id="slack-token" type="password" autocomplete="off" spellcheck="false" required><label for="token-mode">Token account</label><select id="token-mode"><option value="bot">Bot</option><option value="user">User</option></select><button id="connect-token" type="button">Connect token</button></form>
    </details>
  </section>
  <section aria-labelledby="request-heading">
    <h2 id="request-heading">Native request</h2>
    <form id="request-form">
      <div class="request"><label>Method<select id="method"><option>GET</option><option>POST</option><option>HEAD</option></select></label>
      <label class="path">Slack API path<input id="path" value="/auth.test" autocomplete="off" spellcheck="false" required></label></div>
      <label for="body">Body (optional)</label><textarea id="body" rows="3" spellcheck="false" placeholder="Raw native request body"></textarea>
      <div class="actions"><button id="send" type="button" disabled>Send request</button><button id="cancel" class="secondary" type="button" disabled>Stop reading</button></div>
    </form>
    <p id="status" role="status" aria-live="polite">Ready.</p>
    <pre id="response" tabindex="0" aria-label="Native response">Your response will appear here.</pre>
  </section>
</main>
<script type="module" src="/app.js"></script>
</html>
